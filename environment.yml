name: astrolab
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # Scientific stack — all via pip to avoid conda-forge pulling in qt6-main
    - numpy
    - scipy
    - seaborn
    - matplotlib
    - astropy
    - photutils
    - bottleneck
    - PyWavelets
    - astroalign
    - Pillow
    - lz4
    - zstandard
    # Application dependencies
    - pyqt6           # pip layout required for PyInstaller and correct Qt DLL layout
    - pyqtgraph       # interactive figures in the Data Inspector (gui/data_inspector.py)
    - xisf
    - pyinstaller     # build tool only

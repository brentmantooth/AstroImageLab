name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests (fast only)
        run: pytest tests/ -v --tb=short -m "not slow" --cov=analysis --cov=core --cov=synthetic --cov=report --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.os }}

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt6 on Linux requires system OpenGL and XCB libraries for PyInstaller
      # to import PyQt6 during the analysis phase.
      - name: Install Linux Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Build binary
        run: pyinstaller AstroImageLab.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroImageLab-${{ matrix.os }}
          path: dist/AstroImageLab-*.zip
          if-no-files-found: error
